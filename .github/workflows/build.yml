name: iOS Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Projekt erzeugen
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Bauen (unsigniert)
        run: |
          set -o pipefail
          xcodebuild \
            -project AP2Crashkurs.xcodeproj \
            -scheme AP2Crashkurs \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            build 2>&1 | tee build.log | grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Build/Products/Release-iphoneos/AP2Crashkurs.app

      - name: Fehlerlog
        if: failure()
        run: grep -E "error:" -A3 build.log | head -100 || true

      - name: IPA packen
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/AP2Crashkurs.app Payload/
          zip -qry AP2Crashkurs.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: AP2Crashkurs-ipa
          path: AP2Crashkurs.ipa

      - name: Simulator-Build
        run: |
          set -o pipefail
          xcodebuild \
            -project AP2Crashkurs.xcodeproj \
            -scheme AP2Crashkurs \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-sim \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tail -5

      - name: Screenshots
        run: |
          set -e
          UDID=$(xcrun simctl list devices available | grep -E "iPhone 16 Pro \(" | head -1 | grep -oE "[0-9A-F-]{36}")
          if [ -z "$UDID" ]; then UDID=$(xcrun simctl list devices available | grep -E "iPhone" | head -1 | grep -oE "[0-9A-F-]{36}"); fi
          echo "Simulator: $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3
          xcrun simctl install "$UDID" build-sim/Build/Products/Debug-iphonesimulator/AP2Crashkurs.app
          BID=de.heydenis.ap2crashkurs
          mkdir -p shots
          shot () {
            name=$1; shift
            xcrun simctl terminate "$UDID" $BID 2>/dev/null || true
            xcrun simctl launch "$UDID" $BID -demo YES "$@"
            sleep 5
            xcrun simctl io "$UDID" screenshot "shots/$name.png"
          }
          for mode in light dark; do
            xcrun simctl ui "$UDID" appearance $mode
            shot "$mode-1-heute"        -shotTab 0
            shot "$mode-2-themen"       -shotTab 1
            shot "$mode-3-wiederholen"  -shotTab 2
            shot "$mode-4-pruefung"     -shotTab 3
            shot "$mode-5-clip"         -shotTab 0 -shotLesson pseudo1 -shotStep 0
            shot "$mode-6-quiz"         -shotTab 0 -shotLesson sql1 -shotStep 1
            shot "$mode-7-schreiben"    -shotTab 0 -shotLesson pseudo1 -shotStep 2
          done
          cd shots && zip -q ../screenshots.zip *.png

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots/*.png

      - name: Release "latest" aktualisieren
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest AP2Crashkurs.ipa screenshots.zip \
            --title "AP2 Crashkurs, Build ${{ github.run_number }}" \
            --notes "Unsignierte IPA. Auf dem iPhone herunterladen und mit SideStore installieren."
