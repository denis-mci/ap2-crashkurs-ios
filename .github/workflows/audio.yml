name: Vertonung (Piper Thorsten)

on:
  push:
    branches: [main]
    paths:
      - App/Resources/clips.json
      - tools/make_audio.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: audio
  cancel-in-progress: false

jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Piper und ffmpeg installieren
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q "piper-tts>=1.3"
          python -m piper.download_voices de_DE-thorsten-high

      - name: Clips vertonen
        run: python tools/make_audio.py

      - name: Audio committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App/Resources/audio
          if git diff --cached --quiet; then echo "Keine Änderungen"; exit 0; fi
          git commit -m "Vertonung aktualisiert (Piper Thorsten)"
          git push
