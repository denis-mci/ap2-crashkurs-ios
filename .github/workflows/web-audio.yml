name: Web-Vertonung (Erklärvideos)

# Stimme wählen: Repository-Variable TTS_ENGINE = azure | openai | elevenlabs | piper
# Schlüssel als Repository-Secret: AZURE_SPEECH_KEY (+ Variable AZURE_SPEECH_REGION), OPENAI_API_KEY oder ELEVENLABS_API_KEY
on:
  push:
    branches: [main]
    paths:
      - web/src/c_*.js
      - web/src/n_*.js
      - web/src/clips_*.js
      - web/src/nclips_*.js
      - web/src/dialog_*.js
      - tools/export_beats.js
      - tools/make_web_audio.py
      - .github/workflows/web-audio.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: web-audio
  cancel-in-progress: false

jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TTS_ENGINE: ${{ vars.TTS_ENGINE || 'piper' }}
      VOICE_TOM: de_DE-thorsten-high
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ffmpeg installieren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Piper installieren
        if: env.TTS_ENGINE == 'piper'
        run: |
          pip install -q "piper-tts>=1.3"
          python -m piper.download_voices "$VOICE_TOM"
      - name: Sprechtexte exportieren
        run: node tools/export_beats.js
      - name: Vertonen
        # Schlüssel nur in diesem einen Schritt sichtbar
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ vars.AZURE_SPEECH_REGION || 'germanywestcentral' }}
          AZURE_VOICE: ${{ vars.AZURE_VOICE || 'de-DE-FlorianMultilingualNeural' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_VOICE: ${{ vars.OPENAI_VOICE || 'ash' }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
        run: python tools/make_web_audio.py
      - name: Audio committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/audio web/audio_src.json
          if git diff --cached --quiet; then echo "Keine Änderungen"; exit 0; fi
          git commit -m "Web-Vertonung aktualisiert ($TTS_ENGINE)"
          git pull --rebase -q
          git push
      - name: Seite neu veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
