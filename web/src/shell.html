<title>AP2 Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Kalam:wght@400;700&family=Patrick+Hand&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: links Themenbaum (Kategorien aufklappbar, Prozent pro Thema), rechts Arbeitsfläche.
   Unter 960px wird der Baum zur Schublade, unten eine Tab-Leiste. Dunkles Theme für Lernen im Bett. */
:root{
  /* Heft-Look: Recyclingpapier, Füllertinte (Königsblau), Textmarker gelb, Korrekturrot. Keine Verläufe, keine Glows. */
  --bg:#F2F2EE; --surface:#FFFFFF; --sunk:#E9E9E3; --ink:#18202F; --muted:#5B6270; --line:#D9D9D1;
  --accent:#1F45B5; --accent-2:#1F45B5; --accent-soft:#E3E8F6; --accent-ink:#FFFFFF;
  --mark:#FFE15A; --mark-ink:#18202F;
  --ok:#1D7A4A; --ok-bg:#DDEFE3; --bad:#B8342A; --bad-bg:#F6E1DE;
  --ga1:#6A44B8; --ga2:#1F6FA8; --wiso:#B4561A; --exam:#1D7A4A;
  --side:#F8F8F5; --side-ink:#18202F;
  --f-body:"Atkinson Hyperlegible", -apple-system, "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:10px; --tabh:64px; --sidew:316px;
  --shadow:none;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12151B; --surface:#1A1E26; --sunk:#232833; --ink:#E7E8EA; --muted:#A0A5AF; --line:#2E3440;
  --accent:#8FA8F0; --accent-2:#8FA8F0; --accent-soft:#232C44; --accent-ink:#12151B;
  --mark:#E8CC4A; --mark-ink:#12151B; --ok:#62C08C; --ok-bg:#16301F; --bad:#F08A7E; --bad-bg:#3A1C19;
  --ga1:#B39BFF; --ga2:#7FBCE8; --wiso:#F0A86A; --exam:#62C08C; --side:#161A21; --side-ink:#E7E8EA; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151B; --surface:#1A1E26; --sunk:#232833; --ink:#E7E8EA; --muted:#A0A5AF; --line:#2E3440;
  --accent:#8FA8F0; --accent-2:#8FA8F0; --accent-soft:#232C44; --accent-ink:#12151B;
  --mark:#E8CC4A; --mark-ink:#12151B; --ok:#62C08C; --ok-bg:#16301F; --bad:#F08A7E; --bad-bg:#3A1C19;
  --ga1:#B39BFF; --ga2:#7FBCE8; --wiso:#F0A86A; --exam:#62C08C; --side:#161A21; --side-ink:#E7E8EA; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);margin:0}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
a{color:var(--accent)}
h1,h2,h3{line-height:1.2;margin:0;text-wrap:balance;letter-spacing:-.015em}
h1{font-size:1.7rem;font-weight:800}
h2{font-size:1.2rem;font-weight:800}
h3{font-size:1.02rem;font-weight:700}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:.875rem}
.eyebrow{font-size:.85rem;color:var(--muted);font-weight:700}
.stack{display:flex;flex-direction:column;gap:12px}
.stack-lg{display:flex;flex-direction:column;gap:22px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.num{font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}

/* ---------- App-Gerüst ---------- */
.app{display:flex;min-height:100vh}
.side{width:var(--sidew);flex:none;background:var(--side);color:var(--side-ink);border-right:1px solid var(--line);height:100vh;position:sticky;top:0;display:flex;flex-direction:column;z-index:30}
.side-head{padding:16px 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.04rem;letter-spacing:-.01em;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.logo{width:34px;height:34px;border-radius:8px;background:#FFE36E;border:2px solid #1F2A44;display:grid;place-items:center;color:#1F2A44;font-family:"Kalam",cursive;font-size:.9rem;font-weight:700;transform:rotate(-4deg);flex:none}
.brand small{display:block;font-size:.7rem;color:var(--muted);font-weight:600;letter-spacing:0;white-space:nowrap}
.cdx{display:flex;flex-direction:column;align-items:center;line-height:1;padding:5px 9px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface)}
.cdx b{font-size:1.05rem;font-weight:800;color:var(--red,#C8402F)}
.cdx small{font-size:.6rem;color:var(--muted);font-weight:600;margin-top:2px}
.side-scroll{flex:1;overflow-y:auto;padding:6px 14px 16px 12px;overscroll-behavior:contain;display:flex;flex-direction:column;gap:12px}
.resume{display:flex;flex-direction:column;gap:5px;text-align:left;width:100%;padding:11px 12px;border-radius:8px;border:1.5px solid var(--ink);background:var(--surface);cursor:pointer;color:var(--ink)}
.resume:hover{background:var(--accent-soft)}
.rs-ey{font-size:.78rem;font-weight:700;color:var(--muted)}
.rs-t{font-weight:700;font-size:.92rem;line-height:1.3}
.rs-m{display:flex;justify-content:space-between;align-items:center;font-size:.76rem;color:var(--muted);font-weight:600}
.rs-step{display:inline-flex;align-items:center;gap:5px}.rs-step svg{width:13px;height:13px}
.rs-bar{height:4px;border-radius:2px;background:var(--sunk);overflow:hidden}.rs-bar i{display:block;height:100%;background:var(--accent)}
.nav{display:flex;flex-direction:column;gap:1px}
.nv{display:flex;align-items:center;gap:11px;padding:7px 8px;border-radius:6px;border:0;background:none;cursor:pointer;font-weight:600;font-size:.9rem;text-align:left;width:100%;color:var(--side-ink);position:relative}
.nv svg{width:19px;height:19px;flex:none;opacity:.75}
.nv:hover{background:var(--sunk)}
.nv[aria-current="page"]{background:var(--sunk);color:var(--ink);font-weight:700}
.nv[aria-current="page"] svg{opacity:1}
.nv .badge{margin-left:auto;background:var(--bad);color:#fff;font-size:.68rem;border-radius:999px;padding:0 7px;line-height:18px;font-weight:700}
.tree-tools{display:flex;flex-direction:column;gap:8px;padding-top:10px;border-top:1px solid var(--line)}
.tree-h{display:flex;align-items:baseline;justify-content:space-between;padding:0 4px;font-family:var(--f-hand);font-size:1.35rem;color:var(--ink);font-weight:700}
.tree-h .num{font-family:var(--f-body);font-size:.78rem;color:var(--muted);font-weight:700}
.tree-h .num{letter-spacing:0;text-transform:none}
.search{display:flex;align-items:center;gap:8px;padding:0 10px;border:1.5px solid var(--line);border-radius:6px;background:var(--surface)}
.search:focus-within{border-color:var(--accent)}
.search svg{width:16px;height:16px;color:var(--muted);flex:none}
.search input{border:0;background:none;outline:none;font:inherit;font-size:.88rem;color:var(--ink);padding:8px 0;width:100%;min-width:0}
.fchips{display:flex;gap:5px}
.fchips button{flex:1;border:1.5px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 0;font-size:.76rem;font-weight:700;cursor:pointer;color:var(--muted)}
.fchips button.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.fchips button.GA1.on{background:var(--ga1);border-color:var(--ga1);color:#fff}
.fchips button.GA2.on{background:var(--ga2);border-color:var(--ga2);color:#fff}
.fchips button.WISO.on{background:var(--wiso);border-color:var(--wiso);color:#fff}
#tree{display:flex;flex-direction:column;gap:2px}
.cat{border-top:1px solid var(--line)}
.cat:first-child{border-top:0}
.cat-h{display:grid;grid-template-columns:26px 1fr auto 14px;align-items:center;gap:8px;width:100%;padding:10px 4px;border:0;background:none;cursor:pointer;text-align:left;color:var(--side-ink)}
.cat-h:hover .cat-tx b{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.cat-ic{font-family:var(--f-hand);font-weight:700;font-size:1.25rem;color:var(--accent);line-height:1;text-align:center}
.cat-tx{display:flex;flex-direction:column;gap:4px;min-width:0}
.cat-tx b{font-size:.93rem;line-height:1.25}
.cat-tx small{display:none}
.cat-cnt{font-size:.78rem;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.cat-cnt.full{color:var(--ok)}
.cat-bar{height:3px;border-radius:2px;background:var(--sunk);overflow:hidden}
.cat-bar i{display:block;height:100%;background:var(--ok);transition:width .4s}
.cat-h .chev{width:14px;height:14px;transition:transform .2s;opacity:.45}
.cat.open .cat-h .chev{transform:rotate(90deg)}
.cat-b{display:none;flex-direction:column;padding:0 0 10px}
.cat.open .cat-b{display:flex}
.tp{display:grid;grid-template-columns:34px 1fr auto;align-items:baseline;gap:6px;padding:6px 6px 6px 0;border:0;background:none;cursor:pointer;text-align:left;font-size:.9rem;color:var(--side-ink);width:100%;border-radius:4px}
.tp:hover .tt{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.tp .tn{font-variant-numeric:tabular-nums;font-size:.78rem;color:var(--muted);text-align:right;font-weight:700}
.tp .tt{min-width:0;line-height:1.35}
.tp[aria-current="page"] .tt{background:linear-gradient(transparent 45%,var(--mark) 45%,var(--mark) 92%,transparent 92%);font-weight:700;color:var(--ink)}
:root[data-theme="dark"] .tp[aria-current="page"] .tt{color:var(--mark-ink)}
.tp.fin .tt{color:var(--muted)}
.tp .tr{display:flex;align-items:center;gap:6px}
.tp .ck{color:var(--ok);font-family:var(--f-hand);font-weight:700;font-size:1.05rem;line-height:1}
.must{font-size:.72rem;font-weight:700;color:var(--bad)}
.must.GA1{color:var(--ga1)}.must.GA2{color:var(--ga2)}
.pips{display:flex;gap:2px}
.pips i{width:6px;height:6px;border-radius:1px;background:var(--line)}
.pips i.on{background:var(--ok)}
.ring{--p:0;width:30px;height:30px;border-radius:50%;background:conic-gradient(var(--rc,var(--accent)) calc(var(--p)*1%),var(--sunk) 0);display:grid;place-items:center;flex:none}
.ring::after{content:attr(data-v);width:24px;height:24px;border-radius:50%;background:var(--side);display:grid;place-items:center;font-size:.6rem;font-weight:800;font-variant-numeric:tabular-nums;color:var(--muted)}
.ring.full{--rc:var(--ok)}
.ring.full::after{content:"✓";color:var(--ok);font-size:.75rem}
.side-foot{border-top:1px solid var(--line);padding:10px 14px;display:flex;gap:8px;align-items:center;justify-content:space-between;font-size:.76rem;color:var(--muted)}
.mini{border:1px solid var(--line);background:var(--surface);border-radius:9px;width:34px;height:30px;cursor:pointer;font-size:.95rem;color:var(--ink)}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.mtop{display:none}
.view{width:100%;max-width:980px;margin:0 auto;padding:28px 32px 60px}
.scrim{display:none}
.tabs{display:none}

/* ---------- Mobile ---------- */
@media (max-width:959px){
  .side{position:fixed;left:0;top:0;bottom:0;height:100%;width:min(88vw,340px);transform:translateX(-102%);transition:transform .25s cubic-bezier(.3,.7,.2,1);box-shadow:0 0 40px rgba(0,0,0,.25)}
  body.drawer .side{transform:none}
  .scrim{display:block;position:fixed;inset:0;background:rgba(5,8,18,.45);opacity:0;pointer-events:none;transition:opacity .25s;z-index:25}
  body.drawer .scrim{opacity:1;pointer-events:auto}
  .mtop{display:flex;position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 8px;align-items:center;gap:10px}
  .mtop .ttl{flex:1;min-width:0;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .view{padding:16px 16px calc(var(--tabh) + 30px + env(safe-area-inset-bottom,0px))}
  .tabs{display:block;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
  .tabs .in{display:grid;grid-template-columns:repeat(4,1fr);height:var(--tabh)}
  .tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.72rem;font-weight:700;color:var(--muted);cursor:pointer;position:relative}
  .tab svg{width:23px;height:23px}
  .tab[aria-current="page"]{color:var(--accent)}
  .tab .badge{position:absolute;top:8px;left:calc(50% + 8px);background:var(--bad);color:#fff;font-size:.65rem;border-radius:999px;padding:0 5px;min-width:16px;line-height:16px}
  h1{font-size:1.45rem}
  .vp-stage{max-height:none}
}

/* ---------- Bausteine ---------- */
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:.78rem;font-weight:700;background:var(--sunk);color:var(--ink);white-space:nowrap}
.chip.mark{background:var(--mark);color:var(--mark-ink)}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.area{display:inline-block;font-size:.7rem;font-weight:800;letter-spacing:.04em;padding:3px 8px;border-radius:7px;color:#fff;white-space:nowrap}
.area.GA1{background:var(--ga1)}.area.GA2{background:var(--ga2)}.area.WISO{background:var(--wiso)}.area.EXAM{background:var(--exam)}
:root[data-theme="dark"] .area,:root:not([data-theme="light"]) .area{color:#0A0E18}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .area{color:#fff}}
:root[data-theme="light"] .area{color:#fff}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:8px;padding:12px 18px;font-weight:700;cursor:pointer;background:var(--accent);color:var(--accent-ink);min-height:46px;text-decoration:none;transition:transform .1s,filter .15s}
.btn svg{width:18px;height:18px;flex:none}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--sunk);color:var(--ink)}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:7px 12px;font-size:.88rem;border-radius:10px}
.btn:disabled{opacity:.45;cursor:default}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.iconbtn{background:var(--sunk);border:0;border-radius:12px;width:42px;height:42px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none;color:var(--ink)}
.iconbtn svg{width:21px;height:21px}
.bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.bar.mark i{background:var(--mark)}
.bar.ok i{background:var(--ok)}

/* Dashboard */
.hero{position:relative;border-radius:10px;padding:22px 24px;color:var(--ink);border:1.5px solid var(--ink);background:var(--surface);display:grid;grid-template-columns:1fr auto;gap:14px;align-items:end}
.hero h1{font-family:var(--f-hand);font-size:2rem;color:var(--ink);font-weight:700;letter-spacing:0}
.hero p{opacity:.85;font-size:.95rem}
.hero .cd{text-align:right}
.hero .cd b{display:inline-block;font-family:var(--f-hand);font-size:3.8rem;line-height:1;font-weight:700;color:var(--red);border:3px solid var(--red);border-radius:50% 46% 52% 48%/55% 50% 50% 45%;padding:0 14px;transform:rotate(-4deg)}
.hero .cd span{font-size:.8rem;opacity:.85;font-weight:600}
.hero .go{grid-column:1/-1;display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.hero .btn{background:var(--accent);color:var(--accent-ink)}
.hero .btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
@media (max-width:520px){.hero{grid-template-columns:1fr}.hero .cd{text-align:left;display:flex;align-items:center;gap:10px}.hero .cd b{font-size:2.6rem}}
.areas{display:grid;grid-template-columns:auto 1fr auto;gap:10px 14px;align-items:center;font-size:.9rem}
.areas .bar{height:6px}
.areas .area{justify-self:start}
.sumline{font-size:.95rem;color:var(--muted)}.sumline b{color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:1.45rem;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat span{font-size:.75rem;color:var(--muted);font-weight:600}
.todo{display:flex;flex-direction:column;gap:8px}
.todo{gap:0!important;border:1.5px solid var(--ink);border-radius:10px;background:var(--surface);overflow:hidden}
.td{display:grid;grid-template-columns:24px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border:0;border-top:1px solid var(--line);background:var(--surface);cursor:pointer;text-align:left;width:100%}
.todo .td:first-child{border-top:0}
.grid2 .td{border:1px solid var(--line);border-radius:8px}
.td:hover{background:var(--accent-soft)}
.td .ic{width:24px;height:24px;display:grid;place-items:center;color:var(--accent);font-weight:700}
.td .ic svg{width:19px;height:19px}
.td b{display:block;font-size:.95rem}
.td small{color:var(--muted);font-size:.8rem;font-weight:500}
.td.done{opacity:.55}.td.done b{text-decoration:line-through}
.td.done .ic{color:var(--ok)}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.dy{border-radius:10px;padding:7px 6px;background:var(--sunk);font-size:.7rem;text-align:center;line-height:1.25;font-weight:600;color:var(--muted)}
.dy b{display:block;font-size:.95rem;color:var(--ink)}
.dy.today{background:var(--accent);color:var(--accent-ink)}.dy.today b{color:var(--accent-ink)}
.dy.exam{background:var(--bad);color:#fff}.dy.exam b{color:#fff}
.dy.past{opacity:.45}
.tip{display:grid;grid-template-columns:32px 1fr;gap:12px;align-items:start}
.tip .n{width:32px;height:32px;border-radius:10px;background:var(--accent-soft);color:var(--accent);font-weight:800;display:grid;place-items:center}

/* Thema: Kopf + Lernpfad */
.crumb{font-size:.8rem;color:var(--muted);font-weight:600;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.thead{display:flex;gap:16px;align-items:flex-start;justify-content:space-between}
.thead .ring{width:64px;height:64px}
.thead .ring::after{width:52px;height:52px;font-size:.9rem;background:var(--bg)}
.why{background:var(--sunk);border-radius:12px;padding:12px 14px;font-size:.93rem}
.path{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:720px){.path{grid-template-columns:1fr}}
.pstep{position:relative;display:flex;flex-direction:column;gap:6px;text-align:left;padding:16px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;box-shadow:var(--shadow);transition:border-color .15s,transform .15s}
.pstep:hover{border-color:var(--accent);transform:translateY(-1px)}
.pstep .pn{display:flex;align-items:center;justify-content:space-between}
.pstep .pi{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.pstep .pi svg{width:22px;height:22px}
.pstep b{font-size:1.02rem}
.pstep small{color:var(--muted);font-size:.82rem}
.pstep.done .pi{background:var(--ok-bg);color:var(--ok)}
.pstep.next{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.pstep .st{font-size:.72rem;font-weight:700}
.steps{display:flex;gap:6px;background:var(--sunk);padding:4px;border-radius:12px;overflow-x:auto}
.step{flex:1;background:transparent;border:0;border-radius:9px;padding:9px 10px;font-weight:700;font-size:.88rem;cursor:pointer;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.step[aria-current="step"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.step .ck{width:16px;height:16px;border-radius:50%;background:var(--ok);display:none}

/* Kurs-Ansicht mit Schritt-Navigation oben */

/* ---------- Video-Player: Notizbuch auf Karopapier ---------- */
:root{--paper:#FBF9F2;--grid:#D9E3EE;--margin:#E8A4A4;--nb-ink:#1F2A44;--nb-ink2:#56607A;--pen:#2747B8;--red:#C8402F;--hl:#FFE36E;--hl2:#BDE8C5;--hl3:#FFC7B8;--tape:#F1E3B6;

.ck-fb{font-size:.98rem;line-height:1.45}.ck-fb b.ok{color:var(--ok)}.ck-fb b.no{color:var(--red)}
.ck-go{display:block;width:100%;margin-top:12px;background:var(--nb-ink);color:#fff;border:0;border-radius:6px;padding:12px;font-weight:800;font-size:1rem;cursor:pointer}

/* v4: Kamera, Tinte, Zettel, Stempel, Untertitel im Sprechtempo */
.vp-cam{flex:1;position:relative;overflow:hidden;min-height:0;display:flex;cursor:pointer}
.vp-cam .vp-vis{transform-origin:0 0;transition:transform .9s cubic-bezier(.45,.05,.2,1),opacity .3s;will-change:transform}
.vp-ink{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}

@keyframes draw{to{stroke-dashoffset:0}}
.hand-in{animation:hand .8s steps(14) both}
@keyframes hand{from{clip-path:inset(-10% 100% -10% 0)}to{clip-path:inset(-10% 0 -10% 0)}}
.vp-ch.hand-in{animation:hand .7s steps(12) both,mark .6s .6s ease-out both}
.vp-under{display:block;width:72%;height:12px;margin-top:-4px}

.vp-agenda{display:flex;flex-direction:column;gap:4px;margin-top:6px}

.vp-agenda i{font-style:normal;width:24px;height:24px;border:2px solid var(--nb-ink);border-radius:50%;display:grid;place-items:center;font-family:var(--f-hand);font-weight:700;font-size:.85rem;flex:none}
.vp-stamp{position:absolute;top:16px;right:22px;z-index:4;font-family:var(--f-hand);font-weight:700;font-size:1.35rem;color:var(--red);border:3px solid var(--red);border-radius:6px;padding:0 12px;transform:rotate(8deg);background:rgba(251,249,242,.85);pointer-events:none}
.vp-stamp.in{animation:stamp .45s cubic-bezier(.2,1.6,.4,1) both}
@keyframes stamp{from{transform:scale(2.2) rotate(18deg);opacity:0}to{transform:rotate(8deg);opacity:1}}
.vp-note{position:absolute;right:20px;top:58px;z-index:4;width:min(270px,42%);background:#FFF07A;color:var(--nb-ink);padding:14px 14px 16px;transform:rotate(2.5deg);box-shadow:2px 5px 0 rgba(31,42,68,.22);display:flex;flex-direction:column;gap:4px;pointer-events:none}
.vp-note::before{content:"";position:absolute;top:-10px;left:50%;width:70px;height:20px;margin-left:-35px;background:rgba(214,206,170,.85);transform:rotate(-3deg)}
.vp-note b{font-family:var(--f-hand);font-size:1.3rem;color:var(--red);line-height:1}
.vp-note span{font-family:var(--f-note);font-size:1.18rem;line-height:1.25}
.vp-note.in{animation:stick .55s cubic-bezier(.2,1.4,.4,1) both}
@keyframes stick{from{transform:translate(40px,-30px) rotate(14deg);opacity:0}to{transform:rotate(2.5deg);opacity:1}}
@media (max-width:640px){.vp-note{left:44px;right:12px;width:auto;top:auto;bottom:118px}}
.vp-memo{align-self:center;width:min(640px,100%);background:#FFF7B8;color:var(--nb-ink);border:1.5px solid #D8C96A;padding:18px 20px 20px;transform:rotate(-.8deg);box-shadow:3px 5px 0 rgba(31,42,68,.18);background-image:repeating-linear-gradient(transparent 0 31px,rgba(31,42,68,.12) 31px 32px)}
.vp-memo-h{font-family:var(--f-hand);font-weight:700;font-size:1.7rem;color:var(--red);margin-bottom:4px}

.vp-memo li{font-family:var(--f-note);font-size:1.12rem;line-height:1.4;animation:capIn .45s ease-out both}
.vp-memo li::marker{font-family:var(--f-hand);font-weight:700;color:var(--pen)}
.vp-sub.merke{background:#FFF7B8}
.vp-line span .w{opacity:1}
.vp-line span.run .w{opacity:.28;animation:wOn .18s ease-out forwards;animation-play-state:paused}
.vp.talk .vp-line span.run .w,.vp-line span.run.all .w{animation-play-state:running}
.vp-line span.run.all .w{animation-delay:0s!important;animation-duration:.01s}

.vp-line span.run .w.k{animation-name:wOnK}
.vp-line span:not(.run) .w.k{background-size:100% 100%}
@keyframes wOn{to{opacity:1}}
@keyframes wOnK{to{opacity:1;background-size:100% 100%}}
.vp-mz{width:auto;padding:0 10px;gap:4px;display:inline-flex;align-items:center;font-weight:800}
.vp-mz svg{width:18px;height:18px}
.vp-hint{margin:0}
@media (prefers-reduced-motion: reduce){.vp-cam .vp-vis{transition:none}}

.vp-vol{position:relative;display:inline-flex}

#vpVolB b{font-size:.75rem;font-weight:700;min-width:2.6em;text-align:left}
.vp-volpop{position:absolute;bottom:calc(100% + 8px);right:0;z-index:20;display:flex;align-items:center;gap:6px;padding:8px 10px;background:var(--surface);border:1.5px solid var(--ink);border-radius:8px;width:240px}
.vp-volpop input{flex:1;accent-color:var(--accent);min-width:0}
.vp-vs{width:30px;height:30px;border:1px solid var(--line);background:var(--sunk);border-radius:6px;cursor:pointer;font-weight:700;font-size:1.05rem;color:var(--ink)}
@media (max-width:480px){#vpVolB b{display:none}.vp-volpop{right:-60px}}
/* Bild der Szene in der Mitdenk-Frage */

.vp-check{align-items:flex-start}

.tl-fill{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--accent)}

.tl-tip{position:absolute;bottom:24px;left:0;white-space:nowrap;background:var(--ink);color:var(--bg);font-size:.78rem;font-weight:700;padding:4px 8px;border-radius:6px;pointer-events:none}

/* Tagesplan */
.todo .td{grid-template-columns:28px 1fr auto;gap:12px;cursor:default;padding:10px 12px}
.todo .td:hover{background:var(--surface)}
.td.now{background:color-mix(in srgb,var(--mark) 22%,var(--surface))!important}
.tick{width:26px;height:26px;border-radius:6px;border:2px solid var(--ink);background:var(--surface);cursor:pointer;display:grid;place-items:center;font-family:var(--f-hand);font-weight:700;font-size:1.15rem;color:var(--ok);padding:0;line-height:1}
.td.done .tick{border-color:var(--ok);background:var(--ok-bg)}
.tick:disabled{cursor:default}
.td-main{border:0;background:none;text-align:left;cursor:pointer;padding:0;color:inherit;min-width:0}
.td-main b{display:block;font-size:.97rem}

.td.done .td-main b{text-decoration:line-through;text-decoration-color:var(--ok);color:var(--muted)}
.nowtag{display:inline-block;font-family:var(--f-hand);font-weight:700;color:var(--bad);font-size:1rem;margin-bottom:1px}
.dayfoot{align-items:center;gap:12px}.dayfoot p{flex:1;min-width:200px}
.hero.done-day{border-color:var(--ok);background:color-mix(in srgb,var(--ok-bg) 60%,var(--surface))}
.dayp{display:flex;flex-direction:column;gap:5px;width:100%;text-align:left;border:0;background:none;padding:0 4px;cursor:pointer;font-size:.82rem;color:var(--muted)}
.dayp b{color:var(--ink)}
.dayp .rs-bar i{background:var(--ok)}
@media (max-width:560px){.todo .td{grid-template-columns:28px 1fr}.todo .td>.btn{grid-column:2;justify-self:start}}
/* Quiz */
.qtop{display:flex;justify-content:space-between;align-items:center;gap:10px}
.qprog{height:5px;border-radius:3px;background:var(--sunk);overflow:hidden}.qprog i{display:block;height:100%;background:var(--accent)}
.qtext{font-size:1.12rem;font-weight:700;white-space:pre-wrap;line-height:1.45}
.qtext.code{font-family:var(--f-mono);font-size:.9rem;font-weight:400;background:var(--sunk);padding:14px;border-radius:12px;overflow-x:auto;white-space:pre}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:center;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:12px 14px;cursor:pointer;font-weight:600;min-height:54px;transition:border-color .15s,background .15s}
.opt .k{width:28px;height:28px;border-radius:8px;background:var(--sunk);display:grid;place-items:center;font-size:.8rem;font-weight:800;color:var(--muted)}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}.opt.right .k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}.opt.wrong .k{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.conf{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.conf button{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 6px;font-weight:700;font-size:.85rem;cursor:pointer}
.conf button:hover{border-color:var(--accent)}
.inp,.ta{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px}
.inp:focus,.ta:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.ta{min-height:200px;resize:vertical;line-height:1.5}
.ta.mono{font-family:var(--f-mono);font-size:14px}
.fb{border-radius:12px;padding:12px 14px}
.fb.ok{background:var(--ok-bg)}.fb.bad{background:var(--bad-bg)}
.fb b{display:block;margin-bottom:2px}
.fb.ok b{color:var(--ok)}.fb.bad b{color:var(--bad)}
.timer{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.timer i{display:block;height:100%;background:var(--mark);width:100%}
.result{text-align:center;padding:22px 16px}
.result .score{font-weight:800;font-size:3.4rem;line-height:1;letter-spacing:-.03em}
.keys{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.keys li{display:flex;gap:10px;align-items:flex-start;font-size:.92rem}

.keys .miss .m{background:var(--bad-bg);color:var(--bad)}
.model{margin:0;background:var(--sunk);border-radius:12px;padding:12px 14px;font-family:var(--f-mono);font-size:.82rem;white-space:pre-wrap;overflow-x:auto}
.model.pre{white-space:pre}
.sl{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center}

.rules{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}

.verdict.ok{color:var(--ok)}.verdict.bad{color:var(--bad)}
.check{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.check li{padding-left:24px;position:relative}
.check li::before{content:"";position:absolute;left:0;top:.4em;width:13px;height:13px;border:2px solid var(--accent);border-radius:4px}
.empty{text-align:center;padding:28px 16px;color:var(--muted)}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ===== SQL-Labor ===== */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.sqlmsg.bad{background:var(--bad-bg);border-color:var(--bad)}
.sqlmsg small{font-family:var(--f-mono);color:var(--muted);font-size:.78rem;word-break:break-word}
#sqlOut{display:flex;flex-direction:column;gap:10px}
.sqlres{overflow:auto;max-height:420px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.sqlres table{border-collapse:collapse;width:100%;font:500 .86rem var(--f-mono)}
.sqlres th{position:sticky;top:0;background:var(--sunk);text-align:left;font-weight:700;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.sqlres td{padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.sqlres td.n{text-align:right;font-variant-numeric:tabular-nums}
.sqlres td.null{color:var(--muted);font-style:italic}
.sqlres tr:last-child td{border-bottom:0}
.sqltabs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:10px 0}
.sqlside .sqltabs{grid-template-columns:1fr 1fr}
.sqltab{border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--surface)}
.sqltn{display:block;font:700 .85rem var(--f-mono);color:var(--accent);background:none;border:0;padding:0 0 4px;cursor:pointer;text-align:left}
.sqltab ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px}
.sqltab li{display:flex;gap:4px;align-items:baseline;flex-wrap:wrap}
.sqltab li button,.sqltab .col{font:500 .78rem var(--f-mono);color:var(--ink);background:none;border:0;padding:1px 0;cursor:pointer;text-align:left}
.sqltab .col{cursor:default}
.sqltab .pk{text-decoration:underline;text-underline-offset:2px;font-weight:700}
.sqltab .fk{font:.7rem var(--f-mono);color:var(--muted)}
.sqlside h3{margin:0}
.sqlnav{justify-content:space-between;gap:8px;flex-wrap:wrap}
.launch-lab{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px dashed var(--line);border-radius:var(--r);padding:10px 12px;margin-top:4px}
.launch-lab>span:first-child{width:22px;color:var(--accent);flex:none}
.launch-lab>span:nth-child(2){flex:1;display:flex;flex-direction:column}
.launch-lab small{color:var(--muted)}
</style>
